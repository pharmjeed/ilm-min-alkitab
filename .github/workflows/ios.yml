name: iOS build and screens
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild -project IlmMinAlKitab.xcodeproj -scheme IlmMinAlKitab -sdk iphonesimulator \
            -configuration Debug -derivedDataPath build -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; tail -40 build.log; exit 1; }
          grep -E "warning:" build.log | grep -v "/build/" | sort -u | head -40 || true
      - name: Screens
        run: bash ci/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            shots/
            build.log
          if-no-files-found: ignore
