name: TestFlight upload
# Manual: archives a signed Release build and uploads it to App Store Connect (TestFlight).
# Needs: repo variables APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID; repo secret ASC_KEY_P8 (the .p8 file contents).
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ vars.ASC_KEY_ID }}
      ISSUER: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          for v in TEAM KEY_ID ISSUER; do [ -n "${!v}" ] || { echo "missing $v"; exit 1; }; done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || { echo "missing secret ASC_KEY_P8"; exit 1; }
      - name: Tools
        run: brew install xcodegen && bash ci/select-xcode.sh
      - name: Widget positions
        run: python3 ci/widget-verses.py
      - name: Generate project
        run: xcodegen generate
      - name: App Store Connect key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
      # The team has no registered devices, so a development profile (which a signed archive needs) cannot be made.
      # Archive UNSIGNED; the export step signs for the App Store with a cloud-managed distribution certificate.
      - name: Archive (Release, unsigned)
        run: |
          xcodebuild -project IlmMinAlKitab.xcodeproj -scheme IlmMinAlKitab -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ilm.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > archive.log 2>&1 || { grep -E "error:|requires a provisioning|No Accounts|No profiles" archive.log | sort -u | head -60; tail -60 archive.log; exit 1; }
          tail -5 archive.log
      # An unsigned archive carries no entitlements, and the export re-signs with the entitlements it finds in the
      # binary — so sign the archived app ad hoc with ours (Sign in with Apple; the keychain group shared with the
      # widgets, $(AppIdentifierPrefix) written out as the team id) before exporting.
      - name: Embed entitlements
        run: |
          APP=$(find build/Ilm.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          mkdir -p build/ent
          for E in IlmMinAlKitab IlmWidgets; do sed "s/\$(AppIdentifierPrefix)/${TEAM}./" "Config/$E.entitlements" > "build/ent/$E.entitlements"; done
          grep -q "${TEAM}.com.pharmjeed.ilmminalkitab.shared" build/ent/IlmWidgets.entitlements || { echo "keychain group not written out"; exit 1; }
          # the widget extension first (a bundle is signed inside out)
          for X in "$APP"/PlugIns/*.appex; do [ -d "$X" ] && codesign --force --sign - --timestamp=none --entitlements build/ent/IlmWidgets.entitlements "$X"; done
          codesign --force --sign - --timestamp=none --entitlements build/ent/IlmMinAlKitab.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q applesignin || { echo "entitlements missing in the archive"; exit 1; }
      - name: Export locally and check the signed app
        run: |
          sed -e "s/__TEAM__/$TEAM/" -e "s#<string>upload</string>#<string>export</string>#" ci/ExportOptions.plist > build/ExportLocal.plist
          xcodebuild -exportArchive -archivePath build/Ilm.xcarchive -exportOptionsPlist build/ExportLocal.plist             -exportPath build/local -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH"             -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" > export-local.log 2>&1             || { grep -E "error|Error" export-local.log | sort -u | head -60; tail -60 export-local.log; exit 1; }
          mkdir -p build/check && unzip -q -o build/local/*.ipa -d build/check
          APP=$(find build/check/Payload -maxdepth 1 -name '*.app' | head -1)
          codesign -d --entitlements - "$APP" 2>/dev/null | tee entitlements.txt
          grep -q applesignin entitlements.txt || { echo "Sign in with Apple entitlement missing from the signed app"; exit 1; }
          grep -q "ilmminalkitab.shared" entitlements.txt || { echo "keychain group missing from the signed app"; exit 1; }
          X=$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' | head -1)
          codesign -d --entitlements - "$X" 2>/dev/null | tee widget-entitlements.txt | grep -q "ilmminalkitab.shared"             || { echo "keychain group missing from the signed widget"; exit 1; }
      - name: Export and upload to App Store Connect
        run: |
          sed "s/__TEAM__/$TEAM/" ci/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Ilm.xcarchive -exportOptionsPlist build/ExportOptions.plist             -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH"             -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" > export.log 2>&1             || { grep -E "error|Error" export.log | sort -u | head -60; tail -60 export.log; exit 1; }
          tail -20 export.log
      - name: Clean key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            archive.log
            export-local.log
            entitlements.txt
            widget-entitlements.txt
            export.log
          if-no-files-found: ignore
