name: IlmMinAlKitab
options:
  bundleIdPrefix: com.pharmjeed
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
targets:
  IlmMinAlKitab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
        buildPhase: resources
      - path: assets/packs
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pharmjeed.ilmminalkitab
        PRODUCT_NAME: IlmMinAlKitab
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (the iOS preset would otherwise make it universal)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: علم من الكتاب
        CFBundleName: علم من الكتاب
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - Amiri-Regular.ttf
          - Amiri-Bold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.pharmjeed.ilmminalkitab
            CFBundleURLSchemes: [ilm]
schemes:
  IlmMinAlKitab:
    build:
      targets:
        IlmMinAlKitab: all
    run:
      config: Debug
