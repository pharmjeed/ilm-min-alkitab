name: IlmMinAlKitab
options:
  bundleIdPrefix: com.pharmjeed
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
targets:
  IlmMinAlKitab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
        buildPhase: resources
      - path: assets/packs
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pharmjeed.ilmminalkitab
        PRODUCT_NAME: IlmMinAlKitab
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (the iOS preset would otherwise make it universal)
        CODE_SIGN_ENTITLEMENTS: Config/IlmMinAlKitab.entitlements   # Sign in with Apple; the keychain group shared with the widgets
    dependencies:
      - target: IlmWidgets   # embedded in PlugIns
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: علم من الكتاب
        CFBundleName: علم من الكتاب
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true   # «العرض الكبير على شاشة القفل» (owner 2026-11-26)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - Amiri-Regular.ttf
          - Amiri-Bold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.pharmjeed.ilmminalkitab
            CFBundleURLSchemes: [ilm]
  # «اسم اليوم وسنّة اليوم» (home screen) and «اسم اليوم» (lock screen) — owner 2026-11-26. No App Group: the extension
  # carries the small pack files it reads (names/index, sunan/day, every name's positions from ci/widget-verses.py);
  # the collection chosen in «المزيد» reaches it through a keychain group shared with the app (TEAM.* is in every
  # profile, so no new capability).
  IlmWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Fonts
        buildPhase: resources
      - path: assets/packs/names/index.pack
        buildPhase: resources
      - path: assets/packs/sunan/day.pack
        buildPhase: resources
      - path: gen/widget-verses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pharmjeed.ilmminalkitab.widgets
        CODE_SIGN_ENTITLEMENTS: Config/IlmWidgets.entitlements   # the shared keychain group
        PRODUCT_NAME: IlmWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: علم من الكتاب
        CFBundleName: IlmWidgets
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - Amiri-Regular.ttf
          - Amiri-Bold.ttf
schemes:
  IlmMinAlKitab:
    build:
      targets:
        IlmMinAlKitab: all
    run:
      config: Debug
